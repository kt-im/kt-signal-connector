# Windows x64 构建：vcpkg 的 openssl 是静态库（x64-windows-static-md），
# 需要显式链接它依赖的 Windows 系统库，否则链接阶段报：
#   libcrypto.lib(...cryptlib.obj) : error LNK2019: unresolved external symbol
#     __imp_GetProcessWindowStation (OPENSSL_isservice)
#     __imp_GetUserObjectInformationW
#     __imp_MessageBoxW (OPENSSL_showfatal)
#
# 注意：不要用 RUSTFLAGS 环境变量传（空格会被 cargo 当多个参数切分，
# 报 "multiple input filenames provided"），config.toml 的数组形式是安全的。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=user32.lib advapi32.lib crypt32.lib ws2_32.lib gdi32.lib"]
